name: Build Android

on:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit to Google Play
    runs-on: [self-hosted]
    timeout-minutes: 60
    container: ghcr.io/captive-studio/node-ci:24.22.1@sha256:4ba3b88b99c44ce8ed2b8fcc771b59fe14c98d1679a1c4fcf0ca9b9da62bc3c4
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo access
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Ajouter le secret EXPO_TOKEN au dépôt avec accès au projet captivestudio/alveole."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS build and submission
        working-directory: apps/docs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          eas workflow:run build-android.yml --non-interactive --wait
