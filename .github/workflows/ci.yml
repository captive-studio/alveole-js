name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  install:
    name: Install dependencies
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: [captive-small]
    container: node:lts@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate install
        run: npm list --depth=0

  lint:
    name: Lint workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    container: node:lts@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/eslint || npm ci

      - name: Run lint
        run: npm run lint

  format-check:
    name: Check formatting
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    container: node:lts@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/prettier || npm ci

      - name: Run format check
        run: npm run format:check

  typecheck:
    name: Typecheck workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    container: node:lts@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/tsc || npm ci

      - name: Run typecheck
        run: npm run typecheck

  test-unit:
    name: Test Unit workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [self-hosted]
    container: node:lts@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/jest || npm ci

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/components/.jest-cache
          key: jest-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-cache-${{ runner.os }}-

      - name: Unit tests (Jest)
        run: npm run test:unit

  health:
    name: Health (Expo doctor + Web smoke test)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [self-hosted]
    container: node:lts@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/tsc || npm ci

      # apps/docs consomme les packages du monorepo via leur `main` compilé (dist/), jamais
      # généré automatiquement à l'install : sans ce build, Metro échoue à résoudre
      # @alveole/components, @alveole/storybook, etc. au premier import.
      # On cible uniquement packages/* : `npm run build` sans filtre lancerait aussi le
      # build "build" d'apps/docs (expo export complet, ~100s), inutile ici puisqu'on
      # démarre un serveur de dev juste après.
      - name: Build workspace packages
        run: npm run build --workspace=packages/core --workspace=packages/theme --workspace=packages/components --workspace=packages/storybook

      - name: Expo doctor
        working-directory: apps/docs
        run: npx expo-doctor

      - name: Web smoke test
        working-directory: apps/docs
        run: |
          set -e
          CI=1 npm run start -- --web > /tmp/web-smoke-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Le serveur Metro répond immédiatement sur "/" (coquille HTML statique) sans
          # jamais déclencher le vrai bundling : il faut requêter le bundle JS lui-même,
          # extrait du <script src="..."> de la page, pour forcer et valider la compilation.
          html=""
          for i in $(seq 1 30); do
            html=$(curl -sf http://localhost:8081 2>/dev/null) && [ -n "$html" ] && break
            sleep 2
          done
          if [ -z "$html" ]; then
            echo "::error::Le serveur web ne répond pas après 60s"
            cat /tmp/web-smoke-test.log
            exit 1
          fi

          bundle_path=$(echo "$html" | grep -o 'src="[^"]*entry.bundle[^"]*"' | head -1 | sed 's/src="//; s/"$//')
          if [ -z "$bundle_path" ]; then
            echo "::error::Impossible de trouver l'URL du bundle dans la page HTML"
            echo "$html"
            exit 1
          fi

          http_code=$(curl -s -o /tmp/bundle-response.body -w "%{http_code}" "http://localhost:8081${bundle_path}")
          if [ "$http_code" != "200" ]; then
            echo "::error::Le bundling a échoué (HTTP $http_code)"
            cat /tmp/bundle-response.body
            exit 1
          fi

          echo "Bundle web compilé avec succès (HTTP 200)."

  publish-packages:
    name: Publish packages to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: captive-studio/captive-ci/.github/workflows/release-npm.yml@main
    with:
      node-version: "24"
      packages-dir: "packages"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
