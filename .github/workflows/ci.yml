name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

# Renovate et les push successifs sur une PR empilaient jusqu'à 18 jobs simultanés sur le pool
# self-hosted : chaque job devenait 3 à 4 fois plus lent par simple contention CPU/IO (un lint
# mesuré à 71 s au calme montait à 297 s). On annule les runs devenus obsolètes d'une même PR,
# mais jamais ceux de main : un push sur main doit toujours aller au bout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Install dependencies
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: [captive-small]
    timeout-minutes: 15
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate install
        run: npm list --depth=0

  lint:
    name: Lint workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    timeout-minutes: 20
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/eslint || npm ci

      # `--cache-strategy content` côté scripts npm : la stratégie par défaut (metadata) compare
      # les mtime, or actions/checkout les réécrit à chaque run, donc le cache ne servirait jamais.
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/.eslintcache
          key: eslint-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-

      - name: Run lint
        run: npm run lint

  format-check:
    name: Check formatting
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    timeout-minutes: 10
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/prettier || npm ci

      - name: Run format check
        run: npm run format:check

  typecheck:
    name: Typecheck workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    timeout-minutes: 20
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/tsc || npm ci

      # Le typecheck complet coûte 44 s à froid, dont 42 s de vérification de types : le
      # code du dépôt ne fait que 24 000 lignes, mais il en instancie 480 000 à travers les
      # types de Tamagui. Le mode incrémental de TypeScript ramène le total à 6 s dès lors
      # que les .tsbuildinfo survivent d'un run à l'autre. Même stratégie de clé que le cache
      # ESLint : la clé au sha n'est jamais réutilisée telle quelle, elle force une
      # sauvegarde à chaque commit, et le restore-keys fait repartir du cache le plus récent.
      - name: Restore TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Run typecheck
        run: npm run typecheck

  test-unit:
    name: Test Unit workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [self-hosted]
    timeout-minutes: 25
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/jest || npm ci

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/components/.jest-cache
          key: jest-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-cache-${{ runner.os }}-

      - name: Unit tests (Jest)
        run: npm run test:unit

  health:
    name: Health (Expo doctor + Web smoke test)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [self-hosted]
    timeout-minutes: 30
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/tsc || npm ci

      # apps/docs consomme les packages du monorepo via leur `main` compilé (dist/), jamais
      # généré automatiquement à l'install : sans ce build, Metro échoue à résoudre
      # @alveole/components, @alveole/storybook, etc. au premier import.
      # On cible uniquement packages/* : `npm run build` sans filtre lancerait aussi le
      # build "build" d'apps/docs (expo export complet, ~100s), inutile ici puisqu'on
      # démarre un serveur de dev juste après.
      - name: Build workspace packages
        run: npm run build --workspace=packages/core --workspace=packages/theme --workspace=packages/components --workspace=packages/storybook

      - name: Expo doctor
        working-directory: apps/docs
        run: npx expo-doctor

      # Metro range son cache de transformation et sa file-map dans os.tmpdir(), donc dans le
      # /tmp d'un container recréé à chaque job : le graphe (6870 modules, 23 Mo de bundle) était
      # donc intégralement retransformé à chaque run. Mesuré en local, cache vide vs cache chaud :
      # démarrage 155 s -> 16 s, bundling 36 s -> 2 s. On fixe TMPDIR dans le workspace pour que
      # actions/cache puisse le ramasser.
      # La clé ne contient volontairement pas github.sha : elle serait alors différente à chaque
      # commit, le save ne serait jamais sauté et on réécrirait ces 197 Mo à chaque run (mesuré
      # sur le cache node_modules : 91 s de tar + upload pour 278 Mo, soit plus que le npm ci
      # qu'il évite). Sur clé identique, actions/cache saute la sauvegarde. Les 197 Mo sont de
      # toute façon dominés par les transformations de node_modules, qui ne bougent qu'avec le
      # lockfile ; les fichiers source modifiés se retransforment à la volée.
      - name: Restore Metro cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.metro-tmp
          key: metro-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            metro-cache-${{ runner.os }}-

      - name: Web smoke test
        working-directory: apps/docs
        run: |
          set -e
          mkdir -p "$PWD/.metro-tmp"
          export TMPDIR="$PWD/.metro-tmp"
          CI=1 npm run start -- --web > /tmp/web-smoke-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Le serveur Metro répond immédiatement sur "/" (coquille HTML statique) sans
          # jamais déclencher le vrai bundling : il faut requêter le bundle JS lui-même,
          # extrait du <script src="..."> de la page, pour forcer et valider la compilation.
          # 60 s ne suffisaient pas : sur un cache Metro vide, le crawl du monorepo (123 371
          # fichiers, watchFolders pointe la racine) a été mesuré à 155 s avant que "/" réponde.
          html=""
          for i in $(seq 1 120); do
            html=$(curl -sf http://localhost:8081 2>/dev/null) && [ -n "$html" ] && break
            sleep 2
          done
          if [ -z "$html" ]; then
            echo "::error::Le serveur web ne répond pas après 240s"
            cat /tmp/web-smoke-test.log
            exit 1
          fi

          bundle_path=$(echo "$html" | grep -o 'src="[^"]*entry.bundle[^"]*"' | head -1 | sed 's/src="//; s/"$//')
          if [ -z "$bundle_path" ]; then
            echo "::error::Impossible de trouver l'URL du bundle dans la page HTML"
            echo "$html"
            exit 1
          fi

          # Sans --max-time, un Metro bloqué laissait ce curl attendre jusqu'au plafond du job.
          # 600 s couvre largement le pire cas mesuré (bundling à froid + contention du pool).
          http_code=$(curl -s --max-time 600 -o /tmp/bundle-response.body -w "%{http_code}" "http://localhost:8081${bundle_path}") || true
          if [ "$http_code" = "000" ]; then
            echo "::error::Le bundling n'a pas répondu en 600s"
            cat /tmp/web-smoke-test.log
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Le bundling a échoué (HTTP $http_code)"
            cat /tmp/bundle-response.body
            exit 1
          fi

          echo "Bundle web compilé avec succès (HTTP 200)."

  accessibility:
    name: Accessibility (axe on docs)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [self-hosted]
    timeout-minutes: 45
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/playwright || npm ci

      # L'audit porte sur le site de documentation compilé : apps/docs consomme les paquets
      # du monorepo via leur `main` compilé, jamais généré automatiquement à l'install.
      - name: Build workspace packages
        run: npm run build --workspace=packages/core --workspace=packages/theme --workspace=packages/components --workspace=packages/storybook

      # Même cache Metro que le job health : `expo export` retransforme sinon les 6870
      # modules du graphe à chaque run. Voir le commentaire détaillé dans ce job.
      - name: Restore Metro cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.metro-tmp
          key: metro-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            metro-cache-${{ runner.os }}-

      # `expo export` monte à 2,47 Gio de RSS laissé à lui-même, soit plus du double du
      # budget mémoire par job sur lequel le pool est calibré : le kernel tuait le process
      # (exit 137) et emportait le job. Plafonner le tas de V8 force un GC plus fréquent et
      # ramène le pic à 1,62 Gio, tout en accélérant le build (18,6 s -> 12,4 s). La valeur
      # n'est pas au plus juste : à 1024 Mio V8 abandonne (exit 134), 1536 garde la marge.
      - name: Build docs
        working-directory: apps/docs
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          mkdir -p "$PWD/.metro-tmp"
          export TMPDIR="$PWD/.metro-tmp"
          npm run build

      # Le navigateur est téléchargé hors de ~/.cache, que actions/cache ne ramasse pas
      # depuis un container. La clé suit le lockfile : un bump de @playwright/test change
      # la version de navigateur attendue, et un binaire périmé ferait échouer le lancement.
      - name: Restore Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install --with-deps chromium

      # Le cliquet : apps/docs/e2e/a11y-baseline.json fige les violations connues, page par
      # page et règle par règle. Toute violation nouvelle échoue, et toute violation corrigée
      # échoue aussi tant que la baseline n'a pas été resserrée (npm run test:a11y:baseline).
      - name: Run axe audit
        working-directory: apps/docs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npm run test:a11y

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: apps/docs/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  dead-code:
    name: Detect dead code and dependencies
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [captive-small]
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/knip || npm ci

      # knip part des sources, pas de dist/ : aucun build préalable n'est nécessaire. Le
      # script régénère en revanche les *.stories.sources.ts, qui ne sont pas committés et
      # sans lesquels knip voit autant d'imports non résolus qu'il y a de stories.
      - name: Run knip
        run: npm run check:dead-code

  packages:
    name: Validate publishable packages
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    needs: install
    runs-on: [self-hosted]
    container: node:lts@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le cache peut se dire "hit" alors que le téléchargement s'est interrompu en cours de
      # route (ex: "Premature close" côté runner self-hosted) : on vérifie qu'un binaire
      # attendu existe réellement avant de faire confiance au cache, sinon on réinstalle.
      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/publint || npm ci

      # publint et attw inspectent le contenu de dist/ et la cohérence des champs
      # main/types/exports : sans build préalable, ils valideraient un paquet vide.
      - name: Build workspace packages
        run: npm run build --workspace=packages/core --workspace=packages/theme --workspace=packages/components --workspace=packages/storybook

      - name: Validate packages (publint + attw)
        run: npm run check:packages

  publish-packages:
    name: Publish packages to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: captive-studio/captive-ci/.github/workflows/release-npm.yml@329c06f8eac5365a98e1193f10b7c07fe25f36ac # main
    with:
      node-version: '24'
      packages-dir: 'packages'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
