name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Chaque job installe ses dépendances lui-même : avec un store pnpm partagé par le nœud,
# matérialiser node_modules ne coûte plus rien, et le job install qui n'existait que pour
# remplir un cache commun disparaît, avec les 30 s qu'il mettait en tête du chemin critique.
jobs:
  # Les contrôles indépendants continuent après une erreur grâce à !cancelled().
  # Un échec de l'un d'eux conserve le job en échec.
  source-checks:
    name: Source checks (lint, format, types, dependencies)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on:
      - captive-small
    timeout-minutes: 20
    container: ghcr.io/captive-studio/node-ci:24.21.0@sha256:a8729ea83ad487616de71c70ce944dc1a2e50ed8f1821c3911ce603f9dcd4cc7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plus de cache de node_modules : pnpm matérialise l'arbre par liens durs depuis un
      # store partagé par le nœud, et n'écrit donc quasiment aucun octet. L'archive qu'on
      # restaurait ici pesait 178 Mo, se dépliait en 1,1 Go et 91 000 fichiers, et ce
      # déballage répété par chaque job saturait le NVMe partagé par toute la CI.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/.eslintcache
          key: eslint-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-
      - name: Restore TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/.tsbuildinfo
            apps/*/.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-
      - name: Run lint
        run: pnpm run lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Run format check
        run: pnpm run format:check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Run typecheck
        run: pnpm run typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Run knip
        run: pnpm run check:dead-code
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Run jscpd
        run: pnpm run check:duplication
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
  test-unit:
    name: Test Unit workspaces
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on:
      - self-hosted
    timeout-minutes: 25
    container: ghcr.io/captive-studio/node-ci:24.21.0@sha256:a8729ea83ad487616de71c70ce944dc1a2e50ed8f1821c3911ce603f9dcd4cc7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plus de cache de node_modules : pnpm matérialise l'arbre par liens durs depuis un
      # store partagé par le nœud, et n'écrit donc quasiment aucun octet. L'archive qu'on
      # restaurait ici pesait 178 Mo, se dépliait en 1,1 Go et 91 000 fichiers, et ce
      # déballage répété par chaque job saturait le NVMe partagé par toute la CI.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/components/.jest-cache
          key: jest-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-cache-${{ runner.os }}-
      - name: Unit tests (Jest)
        run: pnpm run test:unit
  # Les quatre anciens jobs partagent le build du commit courant. Aucun cache
  # de dist : publint, le lint docs et le navigateur vérifient bien ce build.
  web-and-packages:
    name: Web, accessibility and publishable packages
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on:
      - self-hosted
    timeout-minutes: 45
    container: ghcr.io/captive-studio/node-ci-chromium:24.21.0@sha256:fe7d04c2cab2aa01ac852781a2af7ff139cc0a6bcaf82f5bc152a6389be8b8d3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plus de cache de node_modules : pnpm matérialise l'arbre par liens durs depuis un
      # store partagé par le nœud, et n'écrit donc quasiment aucun octet. L'archive qu'on
      # restaurait ici pesait 178 Mo, se dépliait en 1,1 Go et 91 000 fichiers, et ce
      # déballage répété par chaque job saturait le NVMe partagé par toute la CI.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm run build:packages
        id: packages
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Validate packages (publint + attw)
        run: pnpm run check:packages
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      - name: Run lint on apps/docs
        run: pnpm --filter @alveole/docs run lint:app
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      - name: Expo doctor
        working-directory: apps/docs
        run: npx expo-doctor
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Restore Metro cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.metro-tmp
          key: metro-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            metro-cache-${{ runner.os }}-
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      - name: Build docs
        working-directory: apps/docs
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          DOCS_OUTPUT: single
        run: |
          mkdir -p "$PWD/.metro-tmp"
          export TMPDIR="$PWD/.metro-tmp"
          pnpm run build
        id: docs
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      - name: Run axe audit
        working-directory: apps/docs
        run: pnpm run test:a11y
        if: ${{ !cancelled() && steps.docs.outcome == 'success' }}
      # Garder le serveur de développement en dernier pour éviter qu'un éventuel
      # descendant encore actif ne concurrence l'export et l'audit navigateur.
      - name: Web smoke test
        working-directory: apps/docs
        run: |
          set -e
          mkdir -p "$PWD/.metro-tmp"
          export TMPDIR="$PWD/.metro-tmp"
          CI=1 pnpm run start -- --web > /tmp/web-smoke-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Le serveur Metro répond immédiatement sur "/" (coquille HTML statique) sans
          # jamais déclencher le vrai bundling : il faut requêter le bundle JS lui-même,
          # extrait du <script src="..."> de la page, pour forcer et valider la compilation.
          # 60 s ne suffisaient pas : sur un cache Metro vide, le crawl du monorepo (123 371
          # fichiers, watchFolders pointe la racine) a été mesuré à 155 s avant que "/" réponde.
          html=""
          for i in $(seq 1 120); do
            html=$(curl -sf http://localhost:8081 2>/dev/null) && [ -n "$html" ] && break
            sleep 2
          done
          if [ -z "$html" ]; then
            echo "::error::Le serveur web ne répond pas après 240s"
            cat /tmp/web-smoke-test.log
            exit 1
          fi

          bundle_path=$(echo "$html" | grep -o 'src="[^"]*entry.bundle[^"]*"' | head -1 | sed 's/src="//; s/"$//')
          if [ -z "$bundle_path" ]; then
            echo "::error::Impossible de trouver l'URL du bundle dans la page HTML"
            echo "$html"
            exit 1
          fi

          # Sans --max-time, un Metro bloqué laissait ce curl attendre jusqu'au plafond du job.
          # 600 s couvre largement le pire cas mesuré (bundling à froid + contention du pool).
          http_code=$(curl -s --max-time 600 -o /tmp/bundle-response.body -w "%{http_code}" "http://localhost:8081${bundle_path}") || true
          if [ "$http_code" = "000" ]; then
            echo "::error::Le bundling n'a pas répondu en 600s"
            cat /tmp/web-smoke-test.log
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Le bundling a échoué (HTTP $http_code)"
            cat /tmp/bundle-response.body
            exit 1
          fi

          echo "Bundle web compilé avec succès (HTTP 200)."
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: apps/docs/playwright-report
          retention-days: 7
          if-no-files-found: ignore
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  publish-packages:
    name: Publish packages to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: captive-studio/captive-ci/.github/workflows/release-npm.yml@31ece3f9dc260cb9c73f01de34c2b34ca17a596d # main
    with:
      node-version: '24'
      packages-dir: packages
      package-manager: pnpm
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
