name: Deploy docs to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and deploy docs
    # Attendre la validation du push sur main ; une CI de PR ne publie jamais.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted]
    container: node:lts@sha256:22553920add6fb1fd909104346924cd30b4b3ac76ca2980f3b8dba8ede3cf945
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main peut avoir avancé depuis la CI : construire le commit validé.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Ni `cache: npm` ni `npm ci` : ce job déballait un node_modules complet sur le même
      # NVMe que les runners, en plus des trois déballages de ci.yml. pnpm le matérialise
      # par liens durs depuis le store du nœud.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      # Même plafond que le job d'accessibilité de ci.yml : `expo export` monte sinon à
      # 2,47 Gio de RSS, plus du double du budget mémoire par job du pool.
      - name: Build docs
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: pnpm --filter @alveole/docs run build

      - name: Disable Jekyll (allow _expo/ assets)
        run: touch apps/docs/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/dist
          cname: alveole.captive.fr
